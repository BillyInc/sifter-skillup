# Security (SAST) — replaces .github/workflows/codeql.yml.
#
# CodeQL could never pass here. This repository is PRIVATE, and GitHub code
# scanning on a private repo requires GitHub Advanced Security, a paid add-on.
# The workflow ran to completion every time — checkout, database build, full
# extraction — and then failed on the upload step with:
#
#   Advanced Security must be enabled for this repository to use code scanning.
#
# So all three `Analyze (python | javascript-typescript | actions)` checks were
# permanently red on every PR and on main, which is worse than having no check:
# a red X nobody can ever clear gets ignored, and then a real failure next to it
# gets ignored too.
#
# Semgrep OSS needs no GHAS and no account. This file is a port of the
# .woodpecker/security.yml that was deleted in 410b458a; its reasoning is kept
# because it was all learned the expensive way.
#
# DO NOT ADD A SARIF UPLOAD. `github/codeql-action/upload-sarif` posts to the
# same code-scanning API that GHAS gates, so it would reintroduce the exact
# failure this file exists to remove. Findings belong in the step log.
#
# NO SECRETS. `semgrep ci` wants SEMGREP_APP_TOKEN; `semgrep scan` with
# registry rulesets is anonymous over HTTPS and needs neither token nor
# account. Keep it that way — a secret reference here buys nothing and is a
# standing liability.

name: Semgrep

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Same weekly slot the CodeQL workflow used.
    - cron: "35 2 * * 6"

permissions:
  contents: read

# A push that supersedes an in-flight run cancels it. Actions minutes on this
# account are finite and have run out before.
concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The semgrep image refuses to scan unless the code is at /src:
      # adjust_for_docker() iterates /src and aborts with exit 2 if it is
      # empty, BEFORE any scanning happens — printing nothing, so the step
      # looks like it died for no reason. Mounting the workspace at /src is
      # the documented invocation and avoids that entirely.
      #
      # This failure mode CANNOT be reproduced with the pip package, which has
      # no such check. Only the container behaves this way, so a local pip run
      # proves the rules resolve but never proves the step works.
      #
      # Pinned to a version rather than :latest so a rule-engine change cannot
      # turn main red overnight without a commit that says so.
      - name: Semgrep scan (gating, ERROR only)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.176.0 \
            semgrep scan \
              --config p/default \
              --config p/python \
              --config p/typescript \
              --config p/react \
              --exclude data \
              --exclude node_modules \
              --exclude .venv \
              --exclude dist \
              --severity ERROR \
              --error \
              --metrics off \
              --disable-version-check

      # Advisory only — prints the WARNING-level backlog so it stays visible
      # without gating. This is a report, not a check.
      #
      # The exit code is echoed explicitly rather than swallowed. On the first
      # run of the Woodpecker original, BOTH steps exited non-zero having
      # printed nothing: `--quiet` swallowed the error and `|| true` swallowed
      # the status, so the advisory step reported success while producing no
      # report at all. Never let a step hide its own failure.
      #
      # Runs even when the gating step fails, so one ERROR does not hide the
      # rest of the picture.
      - name: Semgrep scan (advisory, all severities)
        if: always()
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.176.0 \
            semgrep scan \
              --config p/default \
              --config p/python \
              --config p/typescript \
              --config p/react \
              --exclude data \
              --exclude node_modules \
              --exclude .venv \
              --exclude dist \
              --metrics off \
              --disable-version-check \
            || echo "semgrep-advisory exited $? (not gating)"
