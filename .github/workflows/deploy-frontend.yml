name: Deploy Frontend (dev)

on:
  push:
    branches: [main]
    paths:
      # 'app/**' is the expo-router route tree and is NOT covered by 'app.json'
      # — a different path entirely. Without it, a change that only adds or
      # edits routes (a whole new screen stack, say) never triggers a deploy,
      # and the site silently keeps serving the previous build.
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

# Same fixed group as deploy-backend.yml — a push touching both backend/ and src/
# triggers both workflows at once, and both drive nginx/certbot on the shared box.
# Not ref-scoped; cancel-in-progress:false so they queue rather than overlap.
# Per-workflow group. These two USED to share one group
# ("levelup-deploy-dev-storytime") to serialise nginx access — but GitHub keeps
# only ONE pending run per group and CANCELS the older one rather than queueing
# it. Since a push to main triggers both, one was silently dropped every time:
# deploy-backend had 4 cancelled / 5 failed / 0 successful runs, having never
# once completed.
#
# Serialisation still happens where it actually matters — server-side, via
# `flock /tmp/levelup-nginx-deploy.lock` around the nginx/certbot block, which
# both workflows already take. That lock, not the GitHub group, is what keeps a
# concurrent deploy from breaking nginx for KYS and the other apps on this box.
concurrency:
  group: levelup-deploy-dev-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build web export
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Export web bundle
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://api.dev.levelup.com.ng' }}
          EXPO_PUBLIC_PRIVY_APP_ID: ${{ secrets.EXPO_PUBLIC_PRIVY_APP_ID }}
          EXPO_PUBLIC_PRIVY_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_PRIVY_WEB_CLIENT_ID }}
          EXPO_PUBLIC_PRIVY_NATIVE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_PRIVY_NATIVE_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 3

  deploy:
    name: Deploy to storytime
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$SERVER" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"

      - name: Rsync web bundle to server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          # Guard against publishing an empty bundle over a working site.
          test -f dist/index.html
          $SSH "$SERVER_USER@$SERVER_HOST" 'mkdir -p ~/levelup-frontend'
          rsync -avz --delete \
            -e "$SSH" \
            dist/ "$SERVER_USER@$SERVER_HOST:~/levelup-frontend/"

      - name: Configure nginx + TLS on first deploy
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          $SSH "$SERVER_USER@$SERVER_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          exec 9>/tmp/levelup-nginx-deploy.lock
          flock 9
          DOMAIN=dev.levelup.com.ng
          SITE=/etc/nginx/sites-available/levelup-web-dev

          # Written BEFORE the site block below, which includes it: on a fresh
          # box the `nginx -t` in this step would otherwise fail on a missing
          # snippet. The later "Enable gzip compression" step rewrites this same
          # file idempotently for boxes provisioned before gzip existed.
          sudo mkdir -p /etc/nginx/snippets
          sudo tee /etc/nginx/snippets/levelup-gzip.conf >/dev/null <<'NGINX'
          # Managed by the deploy workflows. Edits here are overwritten.
          gzip on;
          gzip_vary on;
          gzip_comp_level 6;
          gzip_min_length 1024;
          gzip_types application/javascript text/javascript application/json application/manifest+json text/css text/plain image/svg+xml;
          NGINX

          if [ ! -f "$SITE" ]; then
            sudo tee "$SITE" >/dev/null <<NGINX
          server {
              server_name $DOMAIN;
              root /home/ubuntu/levelup-frontend;
              index index.html;
              include snippets/levelup-gzip.conf;
              location / { try_files \$uri \$uri/ /index.html; }
              location /assets { expires 1y; add_header Cache-Control "public, immutable"; }
              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;
              listen 80;
          }
          NGINX
            sudo ln -sf "$SITE" /etc/nginx/sites-enabled/levelup-web-dev
            if ! sudo nginx -t; then
              sudo rm -f /etc/nginx/sites-enabled/levelup-web-dev
              echo "nginx config invalid — rolled back levelup-web-dev." >&2
              exit 1
            fi
            sudo systemctl reload nginx
            # Fail LOUDLY. This was `|| echo "certbot failed (DNS not ready?)"`, which
            # swallowed the error and let the job go green with no certificate — the
            # deploy would report success while every browser refused the site. A
            # missing cert is a failed deploy, not a warning.
            if ! sudo certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos --redirect --keep-until-expiring -m admin@levelup.com.ng; then
              echo "::error::certbot failed for $DOMAIN — TLS is NOT configured. Check that $DOMAIN resolves to this host and that :80 is reachable." >&2
              exit 1
            fi
          fi
          EOSSH

      # The block above only runs on FIRST deploy (`if [ ! -f "$SITE" ]`), so a
      # config improvement never reaches an already-provisioned box. This step
      # runs every time and is idempotent.
      #
      # The web bundle is ~23 MB and was served with no Content-Encoding at all:
      # 76s to download, domContentLoaded at 78s. gzip takes it to ~5.7 MB.
      #
      # certbot rewrites $SITE in place (adding the 443 block and TLS
      # directives), so the snippet is INCLUDED rather than the file being
      # regenerated — regenerating would silently drop TLS.
      - name: Enable gzip compression
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          $SSH "$SERVER_USER@$SERVER_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          exec 9>/tmp/levelup-nginx-deploy.lock
          flock 9
          SITE=/etc/nginx/sites-available/levelup-web-dev
          SNIPPET=/etc/nginx/snippets/levelup-gzip.conf
          test -f "$SITE"

          sudo mkdir -p /etc/nginx/snippets
          sudo tee "$SNIPPET" >/dev/null <<'NGINX'
          # Managed by deploy-frontend.yml. Edits here are overwritten.
          gzip on;
          gzip_vary on;
          gzip_comp_level 6;
          gzip_min_length 1024;
          gzip_types application/javascript text/javascript application/json application/manifest+json text/css text/plain image/svg+xml;
          NGINX

          BACKUP=$(mktemp /tmp/levelup-web-dev.XXXXXX)
          sudo cp "$SITE" "$BACKUP"
          if ! grep -q 'snippets/levelup-gzip.conf' "$SITE"; then
            # Anchored on the root directive, so it lands in the block that
            # serves the site and not in certbot's :80 redirect block.
            sudo sed -i '/root \/home\/ubuntu\/levelup-frontend;/a\    include snippets/levelup-gzip.conf;' "$SITE"
          fi

          if ! sudo nginx -t; then
            sudo cp "$BACKUP" "$SITE"
            rm -f "$BACKUP"
            echo "::error::nginx rejected the gzip config - rolled back, site untouched." >&2
            exit 1
          fi
          rm -f "$BACKUP"
          sudo systemctl reload nginx

          # Prove it actually took effect, rather than trusting the reload.
          ENC=$(curl -s -o /dev/null -D - -H 'Accept-Encoding: gzip' \
                  https://dev.levelup.com.ng/ | grep -i '^content-encoding:' || true)
          echo "index.html content-encoding: ${ENC:-<none>}"
          EOSSH

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
