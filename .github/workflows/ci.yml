name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Decompress generated data the app imports
        # The repo stores these generated JSON files only as .json.gz, but the
        # app (DegreeSkills) imports the raw .json, so type-check, tests and the
        # web build fail without them. Never commit the raw files.
        run: |
          gunzip -kf data/career-mapping/_audit/sociology_theme_student_abilities_2026_10_22.json.gz
          gunzip -kf data/career-mapping/_audit/sociology_curriculum_contract_2026-09-17.json.gz

      - name: TypeScript Check
        run: |
          OUTPUT=$(npx tsc --noEmit 2>&1 || true)
          FILTERED=$(echo "$OUTPUT" | grep -v 'src/data/' | grep '^src/' || true)
          if [ -n "$FILTERED" ]; then
            echo "$FILTERED"
            exit 1
          fi

      - name: Tests
        run: npx jest --ci --coverage --passWithNoTests

      - name: Web Build
        run: npx expo export --platform web

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 7

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: uv sync --extra test
      # The whole suite, not a hand-maintained list of five files.
      #
      # This step named its test files explicitly, so every file added since
      # was silently excluded — test_cors_origins, test_skills_payload,
      # test_domain_clusters, test_auth, test_portfolio, test_game and the rest
      # never ran in CI. A test that cannot fail the build is documentation, and
      # nobody edits an allowlist they don't know exists.
      #
      # All 199 currently pass under exactly this environment.
      - name: Tests
        run: uv run pytest -v
        env:
          DEBUG: 'true'
          JWT_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_KEY: placeholder
          REDIS_URL: redis://localhost:6379/0
          SINGLE_DEVICE_ENFORCEMENT: 'false'
