name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: TypeScript Check
        run: |
          OUTPUT=$(npx tsc --noEmit 2>&1 || true)
          FILTERED=$(echo "$OUTPUT" | grep -v 'src/data/' | grep '^src/' || true)
          if [ -n "$FILTERED" ]; then
            echo "$FILTERED"
            exit 1
          fi

      - name: Tests
        run: npx jest --ci --coverage --passWithNoTests

      - name: Web Build
        run: npx expo export --platform web

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 7

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: uv sync --extra test
      - name: Tests
        run: uv run pytest tests/test_offline_sync.py tests/test_device_sessions.py tests/test_starknet_routes.py tests/test_phase5_routes.py tests/test_migration_smoke.py -v
        env:
          DEBUG: 'true'
          JWT_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_KEY: placeholder
          REDIS_URL: redis://localhost:6379/0
          SINGLE_DEVICE_ENFORCEMENT: 'false'

  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/complete-missing-features' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Build Android APK
        run: eas build --platform android --output SkillUp.apk --non-interactive
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: SkillUp.apk
          retention-days: 7

  create-release:
    name: Create Release with APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [frontend, backend, android-build]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/feat/complete-missing-features'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/android-apk/SkillUp.apk
          draft: true
          tag_name: v-${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
