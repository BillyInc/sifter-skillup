name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# A newer push to the same PR supersedes the in-flight run. Pushes to main are
# never cancelled, so every main commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Frontend is split so the type check + web build run in parallel with the jest
  # shards instead of after them. `frontend` (below) is the single aggregate that
  # keeps the "Frontend Checks" check name stable for CI gate and branch rules.
  frontend-static:
    name: Frontend static (types and web build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Decompress generated data the app imports
        # The repo stores these generated JSON files only as .json.gz, but the
        # app (DegreeSkills) imports the raw .json, so type-check, tests and the
        # web build fail without them. Never commit the raw files.
        run: |
          gunzip -kf data/career-mapping/_audit/sociology_theme_student_abilities_2026_10_22.json.gz
          gunzip -kf data/career-mapping/_audit/sociology_curriculum_contract_2026-09-17.json.gz

      - name: TypeScript Check
        run: |
          OUTPUT=$(npx tsc --noEmit 2>&1 || true)
          FILTERED=$(echo "$OUTPUT" | grep -v 'src/data/' | grep '^src/' || true)
          TOTAL=$(echo "$OUTPUT" | grep -c 'error TS' || true)
          GATED=$(echo "$FILTERED" | grep -c . || true)
          echo "tsc errors: $TOTAL total, $GATED gating (src/ excluding src/data/)"
          echo "tsc errors: $TOTAL total, $GATED gating" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$FILTERED" ]; then
            echo "$FILTERED"
            exit 1
          fi

      - name: Web Build
        run: npx expo export --platform web

      - name: Upload web build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-build
          path: dist/
          retention-days: 7

  # The jest suite, split with jest's own --shard. Every shard records how many
  # test files exist in total, how many it was assigned and how many it ran, so
  # the aggregate can prove the shards together covered the whole suite.
  frontend-tests:
    name: Frontend tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Decompress generated data the app imports
        run: |
          gunzip -kf data/career-mapping/_audit/sociology_theme_student_abilities_2026_10_22.json.gz
          gunzip -kf data/career-mapping/_audit/sociology_curriculum_contract_2026-09-17.json.gz

      - name: Tests (shard ${{ matrix.shard }}/4)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          TOTAL=$(npx jest --ci --listTests | grep -c . || true)
          LISTED=$(npx jest --ci --shard="${SHARD}/4" --listTests | grep -c . || true)
          echo "suite has $TOTAL test files; shard $SHARD/4 is assigned $LISTED"
          set +e
          npx jest --ci --shard="${SHARD}/4" --json --outputFile=jest-result.json
          STATUS=$?
          set -e
          RAN=$(jq '.numTotalTestSuites' jest-result.json)
          FAILED=$(jq '.numFailedTestSuites + .numRuntimeErrorTestSuites' jest-result.json)
          echo "shard $SHARD/4 ran $RAN test files ($FAILED failed suites), jest exit $STATUS"
          mkdir -p shard-report
          printf '{"shard":%s,"total":%s,"listed":%s,"ran":%s}\n' "$SHARD" "$TOTAL" "$LISTED" "$RAN" > "shard-report/shard-${SHARD}.json"
          exit "$STATUS"

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jest-shard-${{ matrix.shard }}
          path: shard-report/
          retention-days: 3

  # The one stable "Frontend Checks" check. Fails if the static job or any shard
  # failed, was cancelled or was skipped, and fails if the shards did not run
  # exactly the test files an unsharded run would list (nothing silently dropped).
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [frontend-static, frontend-tests]
    if: always()
    steps:
      - name: Require the static job and every shard to have succeeded
        run: |
          echo "static: ${{ needs.frontend-static.result }}"
          echo "tests:  ${{ needs.frontend-tests.result }}"
          if [ "${{ needs.frontend-static.result }}" != "success" ] || [ "${{ needs.frontend-tests.result }}" != "success" ]; then
            exit 1
          fi
      - name: Download shard reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: jest-shard-*
          path: reports
          merge-multiple: true
      - name: Check the shards covered the whole suite
        run: |
          set -euo pipefail
          COUNT=$(ls reports/shard-*.json | wc -l)
          TOTAL=$(jq -s 'map(.total) | unique | if length == 1 then .[0] else error("shards disagree on the suite size") end' reports/shard-*.json)
          LISTED=$(jq -s 'map(.listed) | add' reports/shard-*.json)
          RAN=$(jq -s 'map(.ran) | add' reports/shard-*.json)
          {
            echo "### Frontend test coverage across shards"
            echo "- shards reporting: $COUNT of 4"
            echo "- test files in the suite (unsharded list): $TOTAL"
            echo "- assigned across shards: $LISTED"
            echo "- actually run: $RAN"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" != "4" ] || [ "$LISTED" != "$TOTAL" ] || [ "$RAN" != "$TOTAL" ]; then
            echo "Shards did not cover the whole suite" >&2
            exit 1
          fi

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: uv sync --extra test
      # Blocking: the backend is at zero findings for the configured rules
      # (see [tool.ruff.lint.per-file-ignores] in backend/pyproject.toml for the
      # three documented exceptions). A new finding fails the build.
      - name: Ruff
        run: uv run ruff check .
      # The whole suite, not a hand-maintained list of five files.
      #
      # This step named its test files explicitly, so every file added since
      # was silently excluded — test_cors_origins, test_skills_payload,
      # test_domain_clusters, test_auth, test_portfolio, test_game and the rest
      # never ran in CI. A test that cannot fail the build is documentation, and
      # nobody edits an allowlist they don't know exists.
      #
      # All 199 currently pass under exactly this environment.
      - name: Tests
        run: uv run pytest -v
        env:
          DEBUG: 'true'
          JWT_SECRET: 58tdjjpRND_pueUvjawwv5zBaiT5oz6FBOMM-vXUodWpUSexzeSReWpcHBK95pfV
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_KEY: placeholder
          REDIS_URL: redis://localhost:6379/0
          SINGLE_DEVICE_ENFORCEMENT: 'false'

  # One stable check name for branch protection. It fails if either job (the
  # `frontend` job is itself the aggregate of the static job and the jest shards) failed,
  # was cancelled, or was skipped, so a skipped job can never read as a pass.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [frontend, backend]
    if: always()
    steps:
      - name: Require every job to have succeeded
        run: |
          echo "frontend: ${{ needs.frontend.result }}"
          echo "backend:  ${{ needs.backend.result }}"
          if [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs.backend.result }}" != "success" ]; then
            exit 1
          fi
