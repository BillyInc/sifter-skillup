name: Deploy Backend (dev)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# Single fixed group shared with deploy-frontend.yml: both workflows rsync to the
# same box and both can run `nginx -t` / `systemctl reload nginx` / `certbot`.
# Not ref-scoped, so a dispatch from a branch cannot race a push to main.
# cancel-in-progress:false so deploys queue instead of being killed mid-rsync.
concurrency:
  group: levelup-deploy-dev-storytime
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_PATH: ~/levelup-backend
  PYTHON_VERSION: '3.13'

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra test
      - name: Ruff
        run: uv run ruff check . || true
      - name: Pytest
        run: uv run pytest --tb=short -q
        env:
          DEBUG: 'true'
          JWT_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_KEY: placeholder
          REDIS_URL: redis://localhost:6379/0
          SINGLE_DEVICE_ENFORCEMENT: 'false'

  deploy:
    name: Deploy to storytime
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # TOFU pin: record the host key now and require it for every later
          # connection (StrictHostKeyChecking=yes), instead of disabling checking.
          ssh-keyscan -H "$SERVER" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"

      - name: Create .env on first deploy only
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          umask 077
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          if $SSH "$SERVER_USER@$SERVER_HOST" '[ -f ~/levelup-backend/.env ]'; then
            echo ".env already present on server — leaving it untouched."
          else
            echo "First deploy — seeding .env from ENV_FILE secret."
            if [ -z "${ENV_FILE:-}" ]; then
              echo "ENV_FILE secret is empty — refusing to create an empty .env." >&2
              exit 1
            fi
            trap 'rm -f "$RUNNER_TEMP/levelup.env"' EXIT
            printf '%s\n' "$ENV_FILE" > "$RUNNER_TEMP/levelup.env"
            chmod 600 "$RUNNER_TEMP/levelup.env"
            $SSH "$SERVER_USER@$SERVER_HOST" 'umask 077; mkdir -p ~/levelup-backend'
            scp -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$RUNNER_TEMP/levelup.env" "$SERVER_USER@$SERVER_HOST:~/levelup-backend/.env"
            $SSH "$SERVER_USER@$SERVER_HOST" 'chmod 600 ~/levelup-backend/.env'
          fi

      - name: Rsync backend to server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          rsync -avz --delete \
            --exclude '.venv' --exclude '__pycache__' --exclude '*.pyc' \
            --exclude 'logs/' --exclude '*.db' --exclude '.git' --exclude '.env' \
            --exclude 'celerybeat-schedule' \
            -e "$SSH" \
            backend/ "$SERVER_USER@$SERVER_HOST:~/levelup-backend/"

      - name: Install deps, install units, restart services
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          $SSH "$SERVER_USER@$SERVER_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          cd ~/levelup-backend
          chmod 600 .env
          # Shared box (KYS also lives here): refuse to start if :8000 is already
          # owned by something that is not our unit.
          if ! systemctl is-active --quiet levelup-backend; then
            if ss -ltnH 'sport = :8000' | grep -q .; then
              echo "port 8000 already in use by another service — aborting." >&2
              exit 1
            fi
          fi
          command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --no-dev
          mkdir -p logs
          sudo cp systemd/levelup-*.service /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl enable levelup-backend levelup-celery-worker levelup-celery-beat
          sudo systemctl reload-or-restart levelup-backend
          sudo systemctl restart levelup-celery-worker levelup-celery-beat
          EOSSH

      - name: Configure nginx + TLS on first deploy
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          $SSH "$SERVER_USER@$SERVER_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          # Serialise nginx/certbot against the other LevelUp deploy jobs — nginx
          # config + reload are shared with KYS on this box.
          exec 9>/tmp/levelup-nginx-deploy.lock
          flock 9
          DOMAIN=api.dev.levelup.com.ng
          SITE=/etc/nginx/sites-available/levelup-api-dev
          if [ ! -f "$SITE" ]; then
            sudo tee "$SITE" >/dev/null <<NGINX
          server {
              server_name $DOMAIN;
              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
              listen 80;
          }
          NGINX
            sudo ln -sf "$SITE" /etc/nginx/sites-enabled/levelup-api-dev
            # If our new site breaks the config, roll it back — a bad config here
            # would also break the next nginx reload done by KYS.
            if ! sudo nginx -t; then
              sudo rm -f /etc/nginx/sites-enabled/levelup-api-dev
              echo "nginx config invalid — rolled back levelup-api-dev." >&2
              exit 1
            fi
            sudo systemctl reload nginx
            sudo certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos --redirect --keep-until-expiring -m admin@levelup.com.ng || echo "certbot failed (DNS not ready?) — re-run after DNS resolves."
          fi
          EOSSH

      - name: Health check
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          $SSH "$SERVER_USER@$SERVER_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -sf --max-time 5 http://127.0.0.1:8000/health >/dev/null; then
              echo "health OK (attempt $i)"
              exit 0
            fi
            echo "health attempt $i failed — retrying in 3s"
            sleep 3
          done
          echo "health check FAILED after 10 attempts" >&2
          sudo systemctl status --no-pager levelup-backend || true
          sudo journalctl -u levelup-backend -n 80 --no-pager || true
          exit 1
          EOSSH

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
