# Migration runner checks and gated database jobs.
#
# The `migrations` job (every PR and push to main) is static: it never connects to
# Postgres/Supabase and never reads a secret. It lints the SQL text, validates the
# manifest, prints the plan and runs the migrate unit tests (synthetic files only).
#
# The `db-status` and `db-apply` jobs touch the real database. They run ONLY from a
# manual workflow_dispatch on main, and only inside the dedicated `production-db`
# GitHub Environment (NOT the `production` environment that deploy-prod.yml uses).
# Configure it under Settings > Environments > production-db with: required reviewers,
# "Prevent self-review" ON, and deployment branches limited to `main`. The connection
# string is the environment secret `DATABASE_URL` (a Supabase Session pooler or direct
# string; never the transaction pooler on port 6543). It is exposed only to the single
# step that runs the runner, as MIGRATE_DATABASE_URL, and is never printed.
#
# Safe-run protocol for `db-apply`:
#   1. Run it with confirm_apply UNTICKED (a dry run). The reviewer reads the output and
#      copies the `plan-sha:` line it prints (also shown in the run summary).
#   2. Run it again with confirm_apply ticked and that sha in `plan_sha`. If the manifest,
#      any file or the ledger changed in between, the sha no longer matches and the run
#      refuses, so a run can never be approved blind.
# Destructive entries run only if named in `approve_ids` together with `approval_ref`;
# rebuild and manual_only entries never run. The runner takes NO backup: take one first.
#
# Every workflow_dispatch input reaches the shell only through `env:` and is validated
# there; none is interpolated into a script with `${{ }}`.
#
# Third-party actions are pinned to commit SHAs (the tag is in the trailing comment).
name: Migrations

on:
  pull_request:
    paths:
      - 'backend/migrate/**'
      - 'backend/migration_*.sql'
      - 'backend/migration_*.sql.gz'
      - 'backend/seed_*.sql'
      - 'backend/seed_*.sql.gz'
      - 'backend/seed_*_parts*/**'
      - 'backend/patch_*.sql'
      - 'backend/tests/test_migrate_*.py'
      - '.github/workflows/migrations.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'status = read-only ledger + plan; apply = run pending entries'
        type: choice
        options: [status, apply]
        default: status
      confirm_apply:
        description: 'apply mode only: tick to execute (unticked = dry run; also needs plan_sha)'
        type: boolean
        default: false
      plan_sha:
        description: 'required with confirm_apply: the plan-sha printed by a dry run of this same plan'
        type: string
        default: ''
      approve_ids:
        description: 'space-separated destructive entry ids approved for this run (optional)'
        type: string
        default: ''
      approval_ref:
        description: 'who approved the destructive entries, and where (required with approve_ids)'
        type: string
        default: ''
      empty_database:
        description: 'tick ONLY if the database is known to be empty (allows an empty ledger)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'backend/migrate/**'
      - 'backend/migration_*.sql'
      - 'backend/migration_*.sql.gz'
      - 'backend/seed_*.sql'
      - 'backend/seed_*.sql.gz'
      - 'backend/seed_*_parts*/**'
      - 'backend/patch_*.sql'
      - 'backend/tests/test_migrate_*.py'
      - '.github/workflows/migrations.yml'

permissions:
  contents: read

# Only superseded pull_request runs are cancelled. A push to main (or a manual run) must
# never cancel a database run that is waiting for approval or already applying.
concurrency:
  group: migrations-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migrations:
    name: Migration lint, plan and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      # Stdlib only; run from the repository root, exactly as documented.
      - name: Verify manifest
        run: python -m backend.migrate verify-manifest

      # Exits 1 on any un-waived lint error (differing .sql/.sql.gz copies, a
      # backslash-quote in a normal string, DROP CONSTRAINT without re-add, SQL
      # whose kind understates what it destroys). Waived findings are still printed.
      - name: Lint migrations
        run: python -m backend.migrate lint --json migrate-lint.json

      - name: Plan (dry run, empty ledger)
        if: always()
        run: |
          python -m backend.migrate plan --dry-run > migrate-plan.txt
          python -m backend.migrate plan --dry-run --json > migrate-plan.json
          cat migrate-plan.txt

      - name: Upload plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migration-plan
          path: |
            migrate-plan.txt
            migrate-plan.json
            migrate-lint.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Migrate unit tests
        working-directory: backend
        run: |
          uv sync --extra test
          uv run pytest tests/test_migrate_*.py -q

  # ---------------------------------------------------------------------------
  # Database jobs: manual, main only, behind the `production-db` environment approval.
  # ---------------------------------------------------------------------------
  db-status:
    name: Ledger status (read-only, needs approval)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'status'
    needs: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-db
    concurrency:
      group: migrations-db
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install database driver (this job only)
        run: pip install 'psycopg[binary]==3.3.9'
      - name: Status
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m backend.migrate status

  db-apply:
    name: Apply pending migrations (needs approval)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'apply'
    needs: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production-db
    concurrency:
      group: migrations-db
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install database driver (this job only)
        run: pip install 'psycopg[binary]==3.3.9'
      # .sql.gz transports are decompressed in memory by the runner (checksums are over the
      # decompressed, BOM/CRLF-normalised text); nothing is written to disk or uploaded.
      - name: Apply (dry run unless confirm_apply is ticked)
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
          EMPTY_DATABASE: ${{ inputs.empty_database }}
          PLAN_SHA: ${{ inputs.plan_sha }}
          APPROVE_IDS: ${{ inputs.approve_ids }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
        run: |
          set -euo pipefail
          args=()
          if [ "$CONFIRM_APPLY" = "true" ]; then
            if ! [[ "$PLAN_SHA" =~ ^[0-9a-f]{64}$ ]]; then
              echo "confirm_apply needs plan_sha: run a dry run first and copy its plan-sha line" >&2
              exit 1
            fi
            args+=(--apply "--plan-sha=$PLAN_SHA")
          fi
          if [ "$EMPTY_DATABASE" = "true" ]; then args+=(--empty-database); fi
          if [ -n "$APPROVE_IDS" ]; then
            # ids may not start with '-': an id can never be read as a runner flag
            id_re='^[A-Za-z0-9_][A-Za-z0-9_.-]*( [A-Za-z0-9_][A-Za-z0-9_.-]*)*$'
            if ! [[ "$APPROVE_IDS" =~ $id_re ]]; then
              echo "approve_ids must be space-separated entry ids (letters, digits, _ . -)" >&2
              exit 1
            fi
            read -ra approve_list <<< "$APPROVE_IDS"
            args+=(--approve "${approve_list[@]}" "--approval-ref=$APPROVAL_REF")
          fi
          python -m backend.migrate apply "${args[@]}" 2>&1 | tee migrate-apply.log
          # Surface the sha so the reviewer can copy it from the run summary.
          grep -E '^plan-sha: ' migrate-apply.log >> "$GITHUB_STEP_SUMMARY" || true
