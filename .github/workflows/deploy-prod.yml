name: Deploy Production

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

# Fixed group, never ref-scoped: one prod deploy at a time regardless of the tag
# or ref that triggered it. Kept separate from the dev group so a prod release is
# not blocked behind a dev push; the nginx/certbot steps take a server-side lock
# that is shared with the dev workflows.
concurrency:
  group: levelup-deploy-prod-storytime
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'
  PROD_BACKEND_DIR: ~/levelup-backend-prod
  PROD_FRONTEND_DIR: ~/levelup-frontend-prod

jobs:
  verify:
    name: Verify (lint & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra test
      - run: uv run ruff check . || true
      - name: Pytest
        run: uv run pytest --tb=short -q
        env:
          DEBUG: 'true'
          JWT_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_KEY: placeholder
          REDIS_URL: redis://localhost:6379/0
          SINGLE_DEVICE_ENFORCEMENT: 'false'

  deploy-backend:
    name: Deploy backend (prod)
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$SERVER" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"

      - name: Create prod .env on first deploy only
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          umask 077
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          $SSH "$SERVER_USER@$SERVER_HOST" 'umask 077; mkdir -p ~/levelup-backend-prod'
          if $SSH "$SERVER_USER@$SERVER_HOST" '[ -f ~/levelup-backend-prod/.env ]'; then
            echo "prod .env already present — leaving untouched."
          else
            if [ -z "${ENV_FILE:-}" ]; then
              echo "ENV_FILE secret is empty — refusing to create an empty prod .env." >&2
              exit 1
            fi
            trap 'rm -f "$RUNNER_TEMP/levelup-prod.env"' EXIT
            printf '%s\n' "$ENV_FILE" > "$RUNNER_TEMP/levelup-prod.env"
            chmod 600 "$RUNNER_TEMP/levelup-prod.env"
            scp -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$RUNNER_TEMP/levelup-prod.env" "$SERVER_USER@$SERVER_HOST:~/levelup-backend-prod/.env"
            $SSH "$SERVER_USER@$SERVER_HOST" 'chmod 600 ~/levelup-backend-prod/.env'
          fi

      - name: Rsync backend to prod dir
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          rsync -avz --delete \
            --exclude '.venv' --exclude '__pycache__' --exclude '*.pyc' \
            --exclude 'logs/' --exclude '*.db' --exclude '.git' --exclude '.env' \
            --exclude 'celerybeat-schedule' \
            -e "$SSH" \
            backend/ "$SERVER_USER@$SERVER_HOST:~/levelup-backend-prod/"

      - name: Derive prod units, install, restart
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          $SSH "$SERVER_USER@$SERVER_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          cd ~/levelup-backend-prod
          chmod 600 .env
          # prod and dev celery-beat must not share a Redis index or every
          # scheduled task double-fires. Fail loudly instead of corrupting dev.
          if [ -f ~/levelup-backend/.env ]; then
            dev_broker=$(grep -E '^CELERY_BROKER_URL=' ~/levelup-backend/.env | tail -1 | cut -d= -f2- || true)
            prod_broker=$(grep -E '^CELERY_BROKER_URL=' .env | tail -1 | cut -d= -f2- || true)
            if [ -n "$dev_broker" ] && [ "$dev_broker" = "$prod_broker" ]; then
              echo "prod CELERY_BROKER_URL is identical to dev — refusing to deploy." >&2
              exit 1
            fi
          fi
          # Shared box (KYS also lives here): refuse to claim :8001 from someone else.
          if ! systemctl is-active --quiet levelup-backend-prod; then
            if ss -ltnH 'sport = :8001' | grep -q .; then
              echo "port 8001 already in use by another service — aborting." >&2
              exit 1
            fi
          fi
          command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --no-dev
          mkdir -p logs
          # Derive -prod units from the dev units: repoint dir, remap port 8000->8001, tag description.
          for f in systemd/levelup-*.service; do
            base=$(basename "$f" .service)
            sudo bash -c "sed -e 's#/home/ubuntu/levelup-backend#$HOME/levelup-backend-prod#g' \
                              -e 's/--port 8000/--port 8001/' \
                              -e 's/LevelUp /LevelUp PROD /' \
                              '$f' > /etc/systemd/system/${base}-prod.service"
          done
          sudo systemctl daemon-reload
          sudo systemctl enable levelup-backend-prod levelup-celery-worker-prod levelup-celery-beat-prod
          sudo systemctl reload-or-restart levelup-backend-prod
          sudo systemctl restart levelup-celery-worker-prod levelup-celery-beat-prod
          EOSSH

      - name: Configure prod nginx + TLS on first deploy
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          $SSH "$SERVER_USER@$SERVER_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          exec 9>/tmp/levelup-nginx-deploy.lock
          flock 9
          DOMAIN=api.levelup.com.ng
          SITE=/etc/nginx/sites-available/levelup-api-prod
          if [ ! -f "$SITE" ]; then
            sudo tee "$SITE" >/dev/null <<NGINX
          server {
              server_name $DOMAIN;
              location / {
                  proxy_pass http://127.0.0.1:8001;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
              listen 80;
          }
          NGINX
            sudo ln -sf "$SITE" /etc/nginx/sites-enabled/levelup-api-prod
            if ! sudo nginx -t; then
              sudo rm -f /etc/nginx/sites-enabled/levelup-api-prod
              echo "nginx config invalid — rolled back levelup-api-prod." >&2
              exit 1
            fi
            sudo systemctl reload nginx
            # Fail LOUDLY. This was `|| echo "certbot failed (DNS not ready?)"`, which
            # swallowed the error and let the job go green with no certificate — the
            # deploy would report success while every browser refused the site. A
            # missing cert is a failed deploy, not a warning.
            if ! sudo certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos --redirect --keep-until-expiring -m admin@levelup.com.ng; then
              echo "::error::certbot failed for $DOMAIN — TLS is NOT configured. Check that $DOMAIN resolves to this host and that :80 is reachable." >&2
              exit 1
            fi
          fi
          EOSSH

      - name: Health check (prod API)
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          $SSH "$SERVER_USER@$SERVER_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -sf --max-time 5 http://127.0.0.1:8001/health >/dev/null; then
              echo "prod health OK (attempt $i)"
              exit 0
            fi
            echo "prod health attempt $i failed — retrying in 3s"
            sleep 3
          done
          echo "prod health check FAILED after 10 attempts" >&2
          sudo systemctl status --no-pager levelup-backend-prod || true
          sudo journalctl -u levelup-backend-prod -n 80 --no-pager || true
          exit 1
          EOSSH

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"

  deploy-frontend:
    name: Deploy frontend (prod)
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Decompress generated data the app imports
        # The repo stores these generated JSON files only as .json.gz, but the
        # app (DegreeSkills) imports the raw .json, so type-check, tests and the
        # web build fail without them. Never commit the raw files.
        run: |
          gunzip -kf data/career-mapping/_audit/sociology_theme_student_abilities_2026_10_22.json.gz
          gunzip -kf data/career-mapping/_audit/sociology_curriculum_contract_2026-09-17.json.gz
      - name: Export web bundle (prod)
        run: npx expo export --platform web
        env:
          # Deliberately a DIFFERENT variable from dev's. Both workflows used to
          # read vars.EXPO_PUBLIC_API_URL; that variable is set to the dev API,
          # and a set variable means the prod fallback never fires — so a prod
          # release would have shipped a bundle pointing at api.dev, with no
          # error anywhere. The documented workaround was "flip the var before
          # tagging", which breaks dev the moment you forget to flip it back.
          # Unset is the correct default here: the fallback IS the prod URL.
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL_PROD || 'https://api.levelup.com.ng' }}
          EXPO_PUBLIC_PRIVY_APP_ID: ${{ secrets.EXPO_PUBLIC_PRIVY_APP_ID }}
          EXPO_PUBLIC_PRIVY_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_PRIVY_WEB_CLIENT_ID }}
          EXPO_PUBLIC_PRIVY_NATIVE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_PRIVY_NATIVE_CLIENT_ID }}

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$SERVER" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"

      - name: Rsync web bundle to prod dir
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          test -f dist/index.html
          $SSH "$SERVER_USER@$SERVER_HOST" 'mkdir -p ~/levelup-frontend-prod'
          rsync -avz --delete \
            -e "$SSH" \
            dist/ "$SERVER_USER@$SERVER_HOST:~/levelup-frontend-prod/"

      - name: Configure prod nginx + TLS on first deploy
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          $SSH "$SERVER_USER@$SERVER_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          exec 9>/tmp/levelup-nginx-deploy.lock
          flock 9
          DOMAIN=levelup.com.ng
          SITE=/etc/nginx/sites-available/levelup-web-prod

          # Written unconditionally and BEFORE the site block: the include below
          # would fail `nginx -t` if prod were provisioned on a box where the
          # dev workflow had never run and created this snippet.
          sudo mkdir -p /etc/nginx/snippets
          sudo tee /etc/nginx/snippets/levelup-gzip.conf >/dev/null <<'NGINX'
          # Managed by the deploy workflows. Edits here are overwritten.
          gzip on;
          gzip_vary on;
          gzip_comp_level 6;
          gzip_min_length 1024;
          gzip_types application/javascript text/javascript application/json application/manifest+json text/css text/plain image/svg+xml;
          NGINX

          if [ ! -f "$SITE" ]; then
            sudo tee "$SITE" >/dev/null <<NGINX
          server {
              server_name $DOMAIN;
              root /home/ubuntu/levelup-frontend-prod;
              index index.html;
              include snippets/levelup-gzip.conf;
              location / { try_files \$uri \$uri/ /index.html; }
              location /assets { expires 1y; add_header Cache-Control "public, immutable"; }
              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;
              listen 80;
          }
          NGINX
            sudo ln -sf "$SITE" /etc/nginx/sites-enabled/levelup-web-prod
            if ! sudo nginx -t; then
              sudo rm -f /etc/nginx/sites-enabled/levelup-web-prod
              echo "nginx config invalid — rolled back levelup-web-prod." >&2
              exit 1
            fi
            sudo systemctl reload nginx
            # Fail LOUDLY. This was `|| echo "certbot failed (DNS not ready?)"`, which
            # swallowed the error and let the job go green with no certificate — the
            # deploy would report success while every browser refused the site. A
            # missing cert is a failed deploy, not a warning.
            if ! sudo certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos --redirect --keep-until-expiring -m admin@levelup.com.ng; then
              echo "::error::certbot failed for $DOMAIN — TLS is NOT configured. Check that $DOMAIN resolves to this host and that :80 is reachable." >&2
              exit 1
            fi
          fi
          EOSSH

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
