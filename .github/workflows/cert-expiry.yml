name: Certificate expiry

# Renewal is the gap the deploy workflows cannot cover.
#
# deploy-*.yml only touch certbot on a FIRST deploy — the block is skipped once
# the vhost exists. Renewal is handled by certbot's own systemd timer on the
# box, entirely outside CI, so a renewal failure would be completely silent
# until browsers started refusing the site.
#
# This checks from the OUTSIDE, over TLS, which is what a visitor actually
# experiences. That catches more than "did certbot run": a renewed cert that
# nginx was never reloaded to pick up still serves the old one, and only an
# external check sees it.

# Manual-only. The daily check now runs on storytime itself via cron —
# see scripts/check-cert-expiry.sh and docs/CERT_EXPIRY_CRON.md. Running it
# there is strictly better: it is the box certbot renews on, so a failing
# renewal is visible in the same place as the timer that should have fixed it.
# This workflow stays dispatchable so the check can also be run from outside
# the box (e.g. to confirm what the public internet actually sees).
#
# To restore the hosted schedule, put back:
#   schedule:
#     - cron: '0 7 * * *'
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check TLS certificate expiry
    runs-on: ubuntu-latest
    steps:
      - name: Check every served hostname
        run: |
          set -uo pipefail   # NOT -e: one unreachable host must not mask the rest

          # Fail with 3 weeks to spare. Certbot attempts renewal at 30 days
          # remaining, so reaching 21 means renewal has already failed for over
          # a week — plenty of runway to fix it by hand.
          FAIL_BELOW=21
          WARN_BELOW=30

          HOSTS="levelup.com.ng www.levelup.com.ng dev.levelup.com.ng api.levelup.com.ng api.dev.levelup.com.ng"

          failed=0
          for h in $HOSTS; do
            end=""
            # Retry: a transient network blip must not page anyone.
            for attempt in 1 2 3; do
              end=$(echo | timeout 20 openssl s_client -servername "$h" -connect "$h":443 2>/dev/null \
                    | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
              [ -n "$end" ] && break
              sleep 5
            done

            if [ -z "$end" ]; then
              echo "::error title=TLS unreachable::$h — could not read a certificate after 3 attempts. The host may be down, or not serving TLS at all."
              failed=1
              continue
            fi

            days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))

            if [ "$days" -lt "$FAIL_BELOW" ]; then
              echo "::error title=Certificate expiring::$h expires in $days days ($end). Certbot renews at 30 days, so renewal has been failing. On the box: sudo certbot renew --dry-run"
              failed=1
            elif [ "$days" -lt "$WARN_BELOW" ]; then
              echo "::warning title=Renewal window::$h expires in $days days ($end) — inside the renewal window, not yet renewed."
            else
              echo "OK   $h — $days days ($end)"
            fi
          done

          exit $failed
