version: '3.9'
services:
  api:
    build: .
    # Publishing 8000 to all interfaces is for local use. In production put it behind
    # exactly one trusted proxy (e.g. "127.0.0.1:8000:8000") and set TRUST_PROXY_HEADERS=true
    # and TRUSTED_PROXY_HOPS=1; see docs/ops/nginx-auth-rate-limit.md.
    ports:
      - "8000:8000"
    env_file: backend/.env
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: celery -A celery_worker worker --loglevel=info
    env_file: backend/.env
    depends_on:
      - redis
    restart: unless-stopped

  beat:
    build: .
    command: celery -A celery_worker beat --loglevel=info
    env_file: backend/.env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
