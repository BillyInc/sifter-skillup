[project]
name = "sifter-skillup-backend"
version = "1.0.0"
description = "FastAPI backend for Sifter Skill_Up — crypto/quant learning platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "python-multipart>=0.0.18",
    "uvicorn[standard]==0.29.0",
    "supabase>=2.4.0",
    "PyJWT[crypto]>=2.9.0",
    "python-dotenv==1.2.2",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "celery[redis]==5.3.6",
    "redis>=5.0.4",
    "eth-account>=0.11.0",
    "httpx>=0.24.0",
    "slowapi==0.1.9",
    "bcrypt>=5.0.0",
    "loguru~=0.7.0",
    "cryptography>=50.0.0",
    "feedparser>=6.0.0",
    "google-auth>=2.30.0",
    "firebase-admin>=7.4.0",
    "tweepy>=4.16.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
]

[tool.uv]
dev-dependencies = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
    "ruff>=0.4.0",
]
