[[entry]]
id = "migration_hard_delete_fk_2026-11-27"
kind = "schema"
allow_destructive_reason = "ALTER TABLE ... DROP CONSTRAINT inside a DO block (migration_hard_delete_fk_2026-11-27.sql) replaces the notifications.actor_id and guilds.owner_id foreign keys, only when their delete action is not already SET NULL, with the same constraint name, column and target plus ON DELETE SET NULL, in the same transaction, added NOT VALID so no table is scanned under that lock; no table or row data is removed"
path = "migration_hard_delete_fk_2026-11-27.sql"
requires = []
verify = []
note = "Additive/idempotent: makes notifications.actor_id and guilds.owner_id ON DELETE SET NULL so the scheduled hard delete cannot hit a foreign-key violation. institution_verification_submissions.submitted_by stays RESTRICT on purpose (the app purges the proof file first). The job works without it, so apply any time; the job stays disabled (ACCOUNT_HARD_DELETE_ENABLED=false) until the owner enables it. The keys are added NOT VALID (they enforce new writes and SET NULL at once); apply migration_hard_delete_fk_validate_2026-11-27.sql afterwards to validate existing rows."
source = "Header of migration_hard_delete_fk_2026-11-27.sql (PROPOSED, NOT APPLIED); audit finding H1"

[[entry]]
id = "migration_hard_delete_fk_validate_2026-11-27"
kind = "schema"
path = "migration_hard_delete_fk_validate_2026-11-27.sql"
requires = ["migration_hard_delete_fk_2026-11-27"]
verify = []
note = "Validates the NOT VALID foreign keys added by migration_hard_delete_fk_2026-11-27 (notifications.actor_id, guilds.owner_id), only those not yet validated. Own transaction (one per entry) so the table scan holds only SHARE UPDATE EXCLUSIVE, not the ACCESS EXCLUSIVE lock of the DROP CONSTRAINT. Idempotent, no row changes; optional for the app, which works without it."
source = "Header of migration_hard_delete_fk_validate_2026-11-27.sql (PROPOSED, NOT APPLIED); CodeRabbit review of PR 326"

