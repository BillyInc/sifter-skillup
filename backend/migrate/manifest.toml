# Ordered migration manifest (phase 1: plan only, nothing here is applied automatically yet).
#
# Entry order IS the apply order. `requires` lists documented hard dependencies and may only
# point backwards. Orders come ONLY from backend/MIGRATION_RUNBOOK.md ("Authoritative
# D078/Sociology apply order") and CLAUDE.md ("Canonical 2026-09-11 order", the additive
# career-guidance list). Anything whose order the docs do not state unambiguously is in
# [[unordered]] at the bottom, with the reason. Do not guess an order: ask the owner.
#
# Fields: id, kind (schema|seed|destructive), path | parts_glob (+expected_parts),
#         requires, verify (phase 2: check queries; empty for now), down (undo script, optional),
#         manual_only (never automatic), approval (required marker for destructive entries),
#         external_requires (dependencies that cannot be an ordered `requires` edge: array of
#         { ref, evidence }; ref = an [[unordered]] path or a LATER ordered id; reported as
#         unresolved by verify-manifest and plan, never reorders anything),
#         allow_destructive_reason (a schema/seed entry whose SQL the linter flags as destructive,
#         e.g. DROP CONSTRAINT/POLICY IF EXISTS before re-creating it; must say why it is safe),
#         note, source.
# `requires` edges added by the hardening pass each cite the SQL line that proves them
# (an ALTER/INSERT/REFERENCES on a table another ordered entry creates).
# Paths are relative to backend/. A `.sql` file is preferred over its `.sql.gz` transport when
# both are committed; both hash identically (checksums are over decompressed bytes).
# kind = "seed" is also used for the four data-loading files that happen to be named migration_*.


