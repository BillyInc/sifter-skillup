# Frontend Checks — mirrors the `frontend` job in .github/workflows/ci.yml.
#
# Woodpecker runs each file under .woodpecker/ as its own workflow, in
# parallel, which is how the two GitHub jobs (frontend, backend) map across.
#
# Unlike GitHub Actions there is no marketplace action for Node/pnpm setup:
# steps are plain containers sharing one workspace volume, so `node_modules`
# written by the install step is still there for the steps after it.

when:
  - event: [push, pull_request]
    branch: [main, develop]

variables:
  # Kept in one place so the toolchain version is a single edit. `node:20` and
  # pnpm 10.33.0 match setup-node's node-version and package.json's
  # packageManager field respectively.
  - &node_image 'node:20'

# The default clone runs `git submodule update --init --recursive` and
# `git lfs fetch`. This repo has neither -- no .gitmodules, no .gitattributes,
# nothing tracked by LFS -- and those two commands still cost ~158s of the
# ~160s clone step, per workflow. Declaring the clone explicitly turns them
# off. `partial` keeps the tree:0 filter the default already used.
clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      lfs: false
      recursive: false
      partial: true

steps:
  - name: install
    image: *node_image
    commands:
      # corepack ships with Node 20 and reads packageManager from package.json,
      # so this pins pnpm to exactly the version the lockfile was written with.
      - corepack enable
      - corepack prepare --activate
      - pnpm install --frozen-lockfile

  - name: typescript
    image: *node_image
    commands:
      # Same filter as CI: src/data/ is generated content and is excluded, and
      # only src/ errors fail the build. `|| true` on the tsc call is
      # deliberate -- tsc's exit code is discarded so that the grep decides,
      # otherwise an error in an ignored path would still fail the step.
      - |
        OUTPUT=$(npx tsc --noEmit 2>&1 || true)
        FILTERED=$(echo "$OUTPUT" | grep -v 'src/data/' | grep '^src/' || true)
        if [ -n "$FILTERED" ]; then
          echo "$FILTERED"
          exit 1
        fi

  - name: tests
    image: *node_image
    commands:
      # sourceEncoding.test.ts shells out to `git ls-files`, so git has to be
      # willing to read the workspace. Under Woodpecker's own clone step the
      # ownership matches and this is a no-op; it matters when the workspace is
      # a bind-mount owned by a different uid, where git refuses with "detected
      # dubious ownership" and takes the whole suite down with it. Cheap
      # insurance against a failure mode that reads as a test bug.
      # `|| true` because this is insurance, not a requirement: if git cannot
      # even evaluate the config command the build should still get to run the
      # tests and fail on something meaningful.
      - git config --global --add safe.directory "$CI_WORKSPACE" || true
      # --runInBand, not --maxWorkers=1: on a 2-CPU host jest already defaults
      # to cpus-1 = 1 worker, so capping workers changes nothing. What costs us
      # is that the single worker is a *separate node process* with its own
      # heap, on a box sitting at ~1GB available with 2.8GB of swap already in
      # use. Running in the main process removes that second heap and the IPC
      # with it. This is the root cause behind the #133 flake, where the first
      # test tripped a 5s timeout on an agent that took 59.2s over a suite that
      # runs in 3s locally -- swap thrash, not a slow test.
      - npx jest --ci --coverage --passWithNoTests --runInBand

  # NO web-build step, and this is a real coverage gap rather than an oversight.
  #
  # `expo export --platform web` wants roughly 1.5-2GB. The agent runs on
  # storytime, which had ~840MB free with 2.7GB of its 6GB swap already in use,
  # while also serving levelup.com.ng, its API, KYS, storytime and fetchit. An
  # OOM there does not fail a build, it takes production down with it.
  #
  # What this costs: bundler and resolver failures that tsc and jest cannot
  # see -- a bad import path, a missing asset, a metro config error -- now
  # reach main unchallenged.
  #
  # Restore the step when CI moves to a host with headroom:
  #
  #   - name: web-build
  #     image: *node_image
  #     commands:
  #       - npx expo export --platform web
  #
  # GitHub's upload-artifact also has no Woodpecker equivalent, so `dist/`
  # would not be retained either way.
