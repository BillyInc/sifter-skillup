# Security (SAST) — replaces the dead CodeQL job from .github/workflows.
#
# GitHub Actions is billing-blocked permanently, so `Analyze (python |
# javascript-typescript | actions)` will never run again. Those checks are not
# coming back, and until this file existed nothing at all was reading the code
# for injection, hardcoded secrets, unsafe deserialization or path traversal.
# Woodpecker is the only CI, so the SAST has to live here.
#
# Semgrep OSS, not the SaaS. Deliberate: `semgrep ci` wants SEMGREP_APP_TOKEN,
# and a secret reference in this file would be a liability out of all
# proportion to what it buys. Woodpecker compiles every .woodpecker/*.yml into
# ONE pipeline and resolves `from_secret` at COMPILE time, so a secret that is
# merely ABSENT aborts the whole compile: status `error`, `workflows: []`, and
# backend + frontend never get scheduled. That is exactly what happened on
# ac61fc9 (error: secret 'server_user' not found). See the long note in
# deploy-dev.yml. `semgrep scan` with registry rulesets needs no token and no
# account, so THIS FILE REFERENCES NO SECRETS — please keep it that way.
#
# COST ON THE AGENT: storytime has ~260MB free while also serving
# levelup.com.ng, its API, KYS, storytime and fetchit. That is the same reason
# frontend.yml has no `expo export --platform web` step -- an OOM here does not
# fail a build, the kernel picks a victim and it can be a live service.
# Semgrep is fine at this size, but only because it is pinned down below:
# --jobs 1 (one worker process, not cpus-1 -- a second worker is a second
# ~200MB heap), --max-memory 800 (semgrep drops an individual oversized target
# instead of being OOM-killed mid-scan), and --max-target-bytes 1000000. In
# practice the scan holds well under that ceiling and takes a couple of
# minutes over ~1200 files. Do NOT add --pro, --sarif upload, or more
# rulesets without re-measuring: rules are loaded into memory together.

when:
  - event: [push, pull_request]
    branch: [main, develop]

# The default clone runs `git submodule update --init --recursive` and
# `git lfs fetch`. This repo has neither -- no .gitmodules, no .gitattributes,
# nothing tracked by LFS -- and those two commands still cost ~158s of the
# ~160s clone step, per workflow. Declaring the clone explicitly turns them
# off. `partial` keeps the tree:0 filter the default already used.
clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      lfs: false
      recursive: false
      partial: true

steps:
  - name: semgrep
    # Official OSS image; the CLI and its rule engine are already inside, so
    # there is no pip/uv install step to pay for. Pinned to a version rather
    # than :latest so a rule-engine change cannot turn main red overnight
    # without a commit that says so.
    image: semgrep/semgrep:1.176.0
    commands:
      # Rulesets are fetched from the public registry over HTTPS. No token,
      # no login, no account -- registry reads are anonymous.
      #
      #   p/default    - the curated cross-language baseline (secrets, injection,
      #                  unsafe deserialization, path traversal)
      #   p/python     - FastAPI/Celery backend
      #   p/typescript - the Expo/RN app and scripts/
      #   p/react      - hook and JSX-specific rules; RN uses React semantics
      #
      # Four rulesets is the ceiling for this box, see the memory note above.
      #
      # --severity ERROR is the whole adoptability argument. The full scan
      # currently reports 104 findings, 88 of them WARNING, and a step that is
      # red on day one gets ignored or deleted within a week. ERROR-only starts
      # green and stays meaningful; the WARNINGs are still printed by the
      # advisory step below, they just do not gate. Tighten to WARNING once the
      # backlog is worked down, not before.
      #
      # There is deliberately no --exclude for litellm-env. That committed
      # Windows virtualenv held every one of the 12 ERROR findings this repo
      # had -- all of them pip's own xmlrpc/tarfile/subprocess usages, none of
      # them ours -- so excluding it was the only thing keeping the gate green.
      # A SAST baseline that holds only because it averts its eyes is not a
      # baseline. The directory has since been removed from git, so the gate
      # now passes on the code we actually own.
      #
      # --exclude data: generated career-mapping SQL/JSON artifacts, some of
      # them hundreds of MB. Not source.
      - |
        semgrep scan \
          --config p/default \
          --config p/python \
          --config p/typescript \
          --config p/react \
          --exclude data \
          --exclude node_modules \
          --exclude .venv \
          --exclude dist \
          --severity ERROR \
          --error \
          --jobs 1 \
          --max-memory 800 \
          --max-target-bytes 1000000 \
          --metrics off \
          --disable-version-check \
          --quiet

  # Advisory only -- prints the WARNING-level backlog so it is visible in the
  # log without gating the build. `|| true` is the entire point of the step:
  # this is a report, not a check. 43 first-party WARNINGs at time of writing.
  # If this ever becomes noise nobody reads, delete the step rather than
  # letting it decay into a green tick that means nothing.
  - name: semgrep-advisory
    image: semgrep/semgrep:1.176.0
    # Runs even when the gating step above fails, so a single ERROR does not
    # hide the rest of the picture.
    when:
      - status: [success, failure]
    commands:
      - |
        semgrep scan \
          --config p/default \
          --config p/python \
          --config p/typescript \
          --config p/react \
          --exclude data \
          --exclude node_modules \
          --exclude .venv \
          --exclude dist \
          --jobs 1 \
          --max-memory 800 \
          --max-target-bytes 1000000 \
          --metrics off \
          --disable-version-check \
          --quiet || true
