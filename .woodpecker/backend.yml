# Backend Checks — mirrors the `backend` job in .github/workflows/ci.yml.

when:
  - event: [push, pull_request]
    branch: [main, develop]

# The default clone runs `git submodule update --init --recursive` and
# `git lfs fetch`. This repo has neither -- no .gitmodules, no .gitattributes,
# nothing tracked by LFS -- and those two commands still cost ~158s of the
# ~160s clone step, per workflow. Declaring the clone explicitly turns them
# off. `partial` keeps the tree:0 filter the default already used.
clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      lfs: false
      recursive: false
      partial: true

steps:
  # WHY THIS EXISTS: `list_domain_clusters` shipped referencing an undefined
  # `published_domain_ids`. The NameError was raised inside the endpoint's own
  # `except Exception`, so it logged and degraded to `coming_soon` instead of
  # crashing -- the Domain Explorer was empty in production and the only signal
  # was a line in the server log. `ruff check --select F821` flags it exactly,
  # in under a second, and nothing in CI was running ruff at all.
  #
  # Deliberately NOT the full default rule set: that reports 179 findings
  # across the backend (unused imports, star-import shadowing, import
  # placement) and gating on them would mean a red pipeline for reasons
  # unrelated to correctness. These are the rules where a hit is a bug rather
  # than a style opinion, and every one of them is already at zero. Widening
  # the set is a separate piece of work with its own cleanup.
  - name: lint
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    directory: backend
    commands:
      # No `uv sync` -- ruff is a standalone binary and this step needs no
      # project dependencies, which keeps it fast and independent of the test
      # step's environment.
      # E999 is deliberately absent: it was removed from ruff, which now always
      # reports syntax errors, and selecting it is a hard failure
      # ("Rule `E999` was removed and cannot be selected") rather than a no-op.
      - uv tool run ruff check --exclude .venv
        --select F821,F822,F823,F811,F632,F702,F706,F707,B018 .

  - name: tests
    # Ships uv on top of the interpreter, replacing the setup-uv +
    # setup-python action pair. Pinned to 3.13 to match CI; pyproject only
    # requires >=3.11, so this is the tighter of the two constraints.
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    directory: backend
    environment:
      # Placeholder credentials, exactly as in the GitHub workflow. Nothing
      # here reaches a real service: the suite never opens a socket, and these
      # exist only because config.py validates presence at import time.
      #
      # JWT_SECRET must stay >=32 chars or the auth tests fail on a length
      # check rather than on what they mean to assert.
      DEBUG: 'true'
      JWT_SECRET: ci-test-secret-must-be-at-least-32-characters-long
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_KEY: placeholder
      REDIS_URL: redis://localhost:6379/0
      SINGLE_DEVICE_ENFORCEMENT: 'false'
    commands:
      - uv sync --extra test
      # The whole suite, not a hand-maintained list of files. Carried over from
      # the GitHub workflow, where naming files explicitly had silently
      # excluded every test added since -- a test that cannot fail the build is
      # documentation, and nobody edits an allowlist they don't know exists.
      - uv run pytest -v
